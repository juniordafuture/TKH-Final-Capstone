name: DevSecOps Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tfsec_scan:
    name: Terraform SAST Scanner
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # The quality gate.
      #
      # soft_fail is deliberately NOT passed. The action's entrypoint tests it
      # with [ -n "$INPUT_SOFT_FAIL" ], which is true for ANY non-empty value -
      # including the literal string "false". Passing soft_fail: false silently
      # ENABLES soft-fail and turns this gate into a rubber stamp. Omitting the
      # input is the only way to make tfsec's non-zero exit break the build.
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.0

      # Inline PR comments. Only meaningful on pull_request events - there is
      # no PR to comment on during a push, so this step is skipped there.
      - name: Run tfsec PR commenter
        if: github.event_name == 'pull_request'
        uses: aquasecurity/tfsec-pr-commenter-action@v1.2.0
        with:
          tfsec_args: --soft-fail=false
          github_token: ${{ secrets.GITHUB_TOKEN }}
